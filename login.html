<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据中台 - 登录</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo">
                    <svg width="50" height="50" viewBox="0 0 50 50">
                        <circle cx="25" cy="25" r="23" fill="#1890ff" opacity="0.1"/>
                        <path d="M25 5 L30 15 L40 15 L32 23 L35 35 L25 28 L15 35 L18 23 L10 15 L20 15 Z" fill="#1890ff"/>
                    </svg>
                </div>
                <h1 class="login-title">企业数据中台</h1>
                <p class="login-subtitle">Data Middle Platform</p>
            </div>
            
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">
                        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        用户名
                    </label>
                    <input type="text" id="username" name="username" placeholder="请输入用户名" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="password">
                        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        密码
                    </label>
                    <input type="password" id="YOUR_PASSWORD" name="password" placeholder="YOUR_PASSWORD" required>
                </div>
                
                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-link">忘记密码？</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    <span>登 录</span>
                </button>
            </form>
            
            <div class="login-footer">
                <p>&copy; 2026 企业数据中台。All rights reserved.</p>
            </div>
        </div>
        
        <div class="login-background">
            <div class="bg-circle bg-circle-1"></div>
            <div class="bg-circle bg-circle-2"></div>
            <div class="bg-circle bg-circle-3"></div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
